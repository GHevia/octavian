name: CI

on:
  push:
  pull_request:

# Python-only jobs exercise the explicit source-only option. The native matrix
# tests default wheel and editable installs on every supported platform/Python pair.
env:
  OCTAVIAN_BUILD_NATIVE: '0'
  PYTHONNOUSERSITE: '1'

jobs:
  windows-asset-runtime:
    name: Windows ASSET runtime
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict
      - name: Create the supported environment
        shell: pwsh
        run: conda env create --file environment.yml
      - name: Install the checkout and verify native ASSET isolation
        shell: pwsh
        run: |
          conda run --name octavian-dev python -m pip install --no-user -e ".[dev]"
          conda run --name octavian-dev python -s -m octavian.diagnostics

  windows-tests:
    name: Windows tests (Python 3.12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a virtual environment, verify ASSET, and run tests
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install --no-user -e ".[dev]"
          .\.venv\Scripts\python -m octavian.diagnostics
          .\.venv\Scripts\python -m pytest tests -q

  linux-tests:
    name: Linux tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create a virtual environment and install
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install --no-user -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ./.venv/bin/python -m ruff check .
      - name: Tests
        run: |
          ./.venv/bin/python -m pytest tests -q
      - name: Docs
        run: |
          ./.venv/bin/python -m mkdocs build --strict

  linux-native-harmonics:
    name: Native spherical harmonics (Linux, pip ASSET)
    runs-on: ubuntu-latest
    env:
      OCTAVIAN_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict
      - name: Create the supported environment and native toolchain
        shell: bash -el {0}
        run: |
          conda env create --file environment.yml
          conda install -y -n octavian-dev -c conda-forge clangxx=18 gcc_impl_linux-64=13 gxx_impl_linux-64=13 cmake ninja
          conda run -n octavian-dev python -m pip install --no-user -e ".[dev]"
      - name: Validate the bundled editable backend
        shell: bash -el {0}
        run: |
          conda run -n octavian-dev python -c 'from octavian import SphericalHarmonics; print(SphericalHarmonics.earth(degree=200).acceleration([7e6, 1e6, 2e6]))'
          conda run -n octavian-dev python -m pytest tests/test_spherical_harmonics.py tests/test_earth_gravity.py -q
          conda run -n octavian-dev python examples/analysis/02_spherical_harmonics.py
