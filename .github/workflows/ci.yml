name: CI

on:
  push:
  pull_request:

jobs:
  windows-asset-runtime:
    name: Windows ASSET runtime
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict
      - name: Create the supported environment
        shell: pwsh
        run: conda env create --file environment.yml
      - name: Install the checkout and verify native ASSET isolation
        shell: pwsh
        run: |
          conda run --name octavian-dev python -m pip install --no-user -e ".[dev]"
          conda run --name octavian-dev python -s -m octavian.diagnostics

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
      - name: Tests
        run: |
          pytest
      - name: Docs
        run: |
          python -m mkdocs build --strict
