name: Harmonics benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Python and C++ harmonic timings
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: '1'
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17.0'
      - name: Install the native backend
        run: python -m pip install -e .
      - name: Compare forces, derivatives, and orbit integration
        shell: bash
        run: python -u native/spherical_harmonics/runtime_comparison.py 2>&1 | tee harmonics-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmonics-benchmark-${{ github.sha }}
          path: harmonics-benchmark.log
