[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "octavian-harmonics-native"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Optional native spherical-harmonic ASSET function for Octavian"
