[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "octavian"
version = "0.1.1"
description = "Trajectory optimization and astrodynamics in Python using ASSET, with mission-script APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Octavian Contributors" }]
dependencies = ["numpy>=1.23"]
optional-dependencies = { viz = ["plotly>=5.18.0"] }

[tool.hatch.build.targets.wheel]
packages = ["octavian"]
