[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "octavian"
version = "0.4.10"
description = "Trajectory optimization and astrodynamics in Python using ASSET, with mission-script APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Octavian Contributors" }]
keywords = ["astrodynamics", "trajectory-optimization", "orbital-mechanics", "space", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "asset_asrl==0.5.1",
  "numpy>=1.23",
  "spiceypy>=6.0",
]

[project.urls]
Homepage = "https://github.com/GHevia/octavian"
Documentation = "https://ghevia.github.io/octavian/"
Repository = "https://github.com/GHevia/octavian"
Issues = "https://github.com/GHevia/octavian/issues"

[project.optional-dependencies]
viz = [
  "matplotlib>=3.7",
  "plotly>=5.18.0",
  "Pillow>=9.0",
]
yaml = [
  "PyYAML>=6.0",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "Pillow>=9.0",
  "plotly>=5.18.0",
  "pytest>=7.4",
  "ruff>=0.6",
  "black>=24.0",
  "pre-commit>=3.6",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.25",
  "PyYAML>=6.0",
]

[tool.hatch.build]
include = [
  "/octavian/**/*.py",
  "/octavian/data/sun_moon_scheduled.bsp",
  "/octavian/viz/data/*.jpg",
  "/octavian/viz/data/*.png",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["octavian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "robustness: deterministic solver-backed robustness campaign cases",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
