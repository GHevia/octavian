name: octavian-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # ASSET currently requires packaging < 26 through basemap. Pinning it here
  # avoids pip replacing a newer conda package during environment creation.
  - packaging<26
  - pip:
      # The ASSET wheel carries its Python-platform-specific native dependency
      # chain. Conda activates Library/bin on Windows; Linux uses the wheel's
      # normal ELF shared-library resolution.
      - asset-asrl==0.5.1
variables:
  # Do not silently borrow packages from a global user-site path.
  PYTHONNOUSERSITE: "1"
